version: '3.8'
services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: aegis
      POSTGRES_PASSWORD: aegis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  flink:
    image: flink:1.18
    ports:
      - "8081:8081"
