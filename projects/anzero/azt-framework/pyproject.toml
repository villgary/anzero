[project]
name = "azt-sdk"
version = "0.1.0"
description = "AZT Framework Python SDK"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-grpc>=0.8.0",
]
