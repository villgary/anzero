syntax = "proto3";

package azt.v1;

option go_package = "github.com/anzero/azt-framework/proto/azt/v1";

message ActionContext {
  string agent_id = 1;
  string action = 2;
  string tool = 3;
  map<string, string> parameters = 4;
  int32 trust_score = 5;
  string session_id = 6;
  int64 timestamp = 7;
}

message EnforcementRequest {
  ActionContext context = 1;
}

enum Decision {
  DECISION_UNSPECIFIED = 0;
  DECISION_ALLOW = 1;
  DECISION_DENY = 2;
  DECISION_REQUIRE_APPROVAL = 3;
}

message EnforcementResponse {
  Decision decision = 1;
  string reason = 2;
  int32 updated_trust_score = 3;
  string request_id = 4;
}

message TrustScoreRequest {
  string agent_id = 1;
}

message TrustScoreResponse {
  int32 score = 1;
  string reason = 2;
  FactorBreakdown breakdown = 3;
  string agent_id = 4;
}

message UpdateTrustScoreRequest {
  string agent_id = 1;
  string factor = 2;
  int32 delta = 3;
  string reason = 4;
  map<string, string> action_context = 5;
}

message GetAgentScoreRequest {
  string agent_id = 1;
}

message FactorBreakdown {
  int32 identity = 1;
  int32 history = 2;
  int32 time = 3;
  int32 anomaly = 4;
  int32 frequency = 5;
}

message ThreatShieldRequest {
  string agent_id = 1;
  string action = 2;
  string tool = 3;
  string prompt = 4;
  string output = 5;
  map<string, string> parameters = 6;
  int32 trust_score = 7;
  int64 timestamp = 8;
}

message ThreatShieldResponse {
  string decision = 1;
  int32 severity_score = 2;
  repeated string indicators = 3;
  string reason = 4;
}

service AZTGateway {
  rpc Enforce(EnforcementRequest) returns (EnforcementResponse);
  rpc GetTrustScore(TrustScoreRequest) returns (TrustScoreResponse);
  rpc UpdateTrustScore(UpdateTrustScoreRequest) returns (TrustScoreResponse);
  rpc GetAgentScore(GetAgentScoreRequest) returns (TrustScoreResponse);
  rpc ThreatShieldScan(ThreatShieldRequest) returns (ThreatShieldResponse);
}
